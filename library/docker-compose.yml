services:
  postgres:
    image: postgres:16-alpine
    container_name: library-postgres
    environment:
      POSTGRES_DB: library
      POSTGRES_USER: library
      POSTGRES_PASSWORD: library
    ports:
      - "5433:5432"
    volumes:
      - library-pgdata:/var/lib/postgresql/data

  kafka:
    image: apache/kafka:3.9.0
    container_name: library-kafka
    ports:
      - "9092:9092"

volumes:
  library-pgdata: