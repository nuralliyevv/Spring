spring:
  application:
    name: catalog
  profiles:
    active: dev
  datasource:
    url: jdbc:postgresql://localhost:5432/catalog
    username: catalog
    password: catalog
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

catalog:
  name: Book Catalog
  default-page-size: 10
  max-page-size: 50

external:
  open-library:
    base-url: https://openlibrary.org
    connect-timeout: 2s
    read-timeout: 3s

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-key-change-me-please-0123456789}
    expiration: 1h